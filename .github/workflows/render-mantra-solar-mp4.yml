name: Render Mantra Solar MP4 with Marathi Voice and FFmpeg
'on':
  workflow_dispatch:
    inputs:
      script:
        description: "Paste Marathi script: one scene per line"
        required: true
        type: string
      seconds_per_scene:
        description: "Seconds per scene (3 to 15)"
        required: true
        default: "6"
        type: string
      marathi_voice:
        description: "Free Marathi neural voice"
        required: true
        default: "mr-IN-AarohiNeural"
        type: choice
        options:
          - mr-IN-AarohiNeural
          - mr-IN-ManoharNeural
permissions:
  contents: read
concurrency:
  group: mantra-solar-mp4-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg and free Marathi TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install --user --break-system-packages edge-tts
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build animated composition
        env:
          MANTRA_SCRIPT: ${{ inputs.script }}
          SCENE_SECONDS: ${{ inputs.seconds_per_scene }}
        run: |
          mkdir -p video-studio/hyperframes
          cd video-studio/hyperframes
          python3 ../render_hyperframes.py
      - name: Animate scenes with HyperFrames, Three.js and GSAP
        working-directory: video-studio/hyperframes
        run: npx --yes hyperframes render --output silent-render.mp4
      - name: Generate free Marathi AI voiceover with Microsoft Edge TTS
        env:
          MANTRA_SCRIPT: ${{ inputs.script }}
          MARATHI_VOICE: ${{ inputs.marathi_voice }}
        working-directory: video-studio/hyperframes
        run: |
          edge-tts --voice "$MARATHI_VOICE" --text "$MANTRA_SCRIPT" --write-media voiceover.mp3
      - name: Render final H.264 MP4 with Marathi voiceover
        working-directory: video-studio/hyperframes
        run: |
          VIDEO_SECONDS=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 silent-render.mp4)
          ffmpeg -y -i silent-render.mp4 -i voiceover.mp3 -map 0:v:0 -map 1:a:0 -c:v libx264 -pix_fmt yuv420p -preset medium -crf 20 -af "apad" -t "$VIDEO_SECONDS" -c:a aac -b:a 192k -movflags +faststart mantra-solar.mp4
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: mantra-solar-mp4
          path: video-studio/hyperframes/mantra-solar.mp4
          if-no-files-found: error
          retention-days: 7
